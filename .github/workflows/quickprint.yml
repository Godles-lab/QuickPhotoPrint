name: Build QuickPhotoPrint
on:
  workflow_dispatch:
  push:
    tags:
      - 'quickprint-v*'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: macos-14
            label: macOS-arm64
          - os: macos-15-intel
            label: macOS-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: quickprint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            quickprint/requirements.txt
      - name: Install
        run: python -m pip install -r ../requirements-dev.txt
      - name: Test layout, ICC and printing engine
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
      - name: Prepare isolated Windows PDF driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Service Spooler
          if (-not (Get-PrinterDriver -Name 'Microsoft Print To PDF' -ErrorAction SilentlyContinue)) {
            Enable-WindowsOptionalFeature -Online -FeatureName Printing-PrintToPDFServices-Features -All -NoRestart
            Add-PrinterDriver -Name 'Microsoft Print To PDF'
          }
          Add-Printer -Name 'QuickPhotoPrint-Test-PDF' -DriverName 'Microsoft Print To PDF' -PortName 'PORTPROMPT:'
      - name: Verify native Windows driver output to PDF only
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/windows_driver_smoke.py
      - name: Build standalone app
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: QuickPhotoPrint-${{ matrix.label }}
          path: quickprint/release/*.zip
          if-no-files-found: error
          retention-days: 14
